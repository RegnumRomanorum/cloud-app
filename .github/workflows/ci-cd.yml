
name: Cloud App CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      # 1. Получение кода
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Установка Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 3. Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Тестирование
      - name: Run tests
        run: python -m pytest -v

      # 5. Подготовка имени образа
      - name: Prepare image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # 6. Авторизация в GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Сборка и отправка Docker-образа
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # 8. Развёртывание на AWS EC2
      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "IMAGE='$IMAGE:$IMAGE_TAG' bash -s" <<'REMOTE'
          set -e

          docker pull "$IMAGE"

          docker stop cloud-app || true
          docker rm cloud-app || true

          docker run -d \
            --name cloud-app \
            --restart unless-stopped \
            -p 5000:5000 \
            "$IMAGE"

          sleep 3
          curl --fail http://localhost:5000/
          REMOTE
